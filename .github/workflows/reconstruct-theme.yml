name: Reconstruct InSales theme

on:
  push:
    branches:
      - igorsprosko-cyber-patch-1

permissions:
  contents: write

jobs:
  reconstruct:
    if: ${{ !contains(github.event.head_commit.message, '[skip reconstruct]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Unpack theme archive
        shell: bash
        run: |
          set -euo pipefail
          test -f myshop-czi161_theme_2026-08-04.zip
          unzip -o myshop-czi161_theme_2026-08-04.zip
          rm myshop-czi161_theme_2026-08-04.zip

      - name: Commit reconstructed theme
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Реконструкция кода темы InSales [skip reconstruct]" || exit 0
          git push origin HEAD:igorsprosko-cyber-patch-1
